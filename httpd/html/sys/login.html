<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml" lang="en" class="login" data-theme="{{$.context.Theme}}">
  <head>
    <title>Access Control - HTTP: Login</title>
    <link rel="manifest"   href="/manifest.json">
    <link rel="icon"       href="/images/favicon.svg">
    <link rel="stylesheet" href="/css/uhppoted.css" type="text/css">
    <link rel="stylesheet" href="/css/login.css" type="text/css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="dark">
  </head>

  <body> 
    <div id="content" class="login-shell">
      <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
          <div class="login-brand">
            <img class="login-logo" src="/images/access-control-logo.svg" alt="" />
            <div>
              <p class="login-eyebrow">UHPPOTE ACCESS CONTROL</p>
              <h1 id="login-title">Access Control - HTTP</h1>
              <p>Secure controller management</p>
            </div>
          </div>
          <div id="form">
            <fieldset id="login">
              <legend>{{.Login.Legend}}</legend>
              <form action="/authenticate" method="POST" onsubmit="login(event)"> 
                <div class="login-field">
                  <label for="uid">{{.Login.UserID.Hint}}</label>
                  <div class="field">
                    <input id="uid" name="uid" type="text" size="28" placeholder="{{.Login.UserID.Hint}}" autocomplete="username" required value="" autofocus />
                  </div>
                </div>
                <div class="login-field">
                  <label for="pwd">{{.Login.Password.Hint}}</label>
                  <div class="field">
                    <input id="pwd" name="pwd" type="password" size="28" placeholder="{{.Login.Password.Hint}}" autocomplete="current-password" required value="" />
                    <img src="/images/{{$.context.Theme}}/eye-solid.svg"
                         alt="Show or hide password" role="button" tabindex="0"
                         onclick="onShowHidePassword(event, 'pwd')"
                         onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); onShowHidePassword(event, 'pwd') }"
                         data-hide='/images/{{$.context.Theme}}/eye-slash-solid.svg'
                         data-show='/images/{{$.context.Theme}}/eye-solid.svg' />
                  </div>
                </div>
                <button type="submit">{{.Login.Ok.Label}}</button>
              </form>
            </fieldset>

            <div id="message" class="message">
              <input id="warning" class="warning" readonly />
            </div>
          </div>
        </section>
      </main>
      {{template "footer" .}}
    </div>
  </body>

  <!-- SCRIPTS -->
 
  <script type="module">
    import { onShowHidePassword } from "/javascript/uhppoted.js"
    import { login              } from "/javascript/login.js"

    window.onShowHidePassword = onShowHidePassword
    window.login = login
  </script>

  <!-- global information initialised by Go template -->
  <script>
    var constants = {
      theme: {{$.context.Theme}},
      mode: {{ $.context.Mode}},
    }

    var messages = {
      unauthorized: '{{.Login.Unauthorized}}'
    }
  </script>
</html>
